<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reclaimed card lab</title>
    <style>
      :root { --bg: #17191d; --card: #23262c; --ink: #ece6d8; --dim: #a59d8c; --gold: #f2c14e; --blue: #5ab0f0; --red: #ff7a5c; --green: #8fd16a; --violet: #b48cf0; }
      html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
      body { padding: 8px 10px 60px; max-width: 980px; margin: 0 auto; }
      h1 { font: 600 17px Georgia, serif; margin: 4px 0 6px; }
      h2 { font: 600 14px Georgia, serif; margin: 12px 0 4px; color: var(--gold); }
      button, select, input, textarea { font: inherit; background: #30343b; color: inherit; border: 1px solid #4a4f58; border-radius: 7px; padding: 6px 10px; }
      button { min-height: 40px; cursor: pointer; }
      button.main { background: #5a3f12; border-color: #8a6a2e; font-weight: 600; }
      button:disabled { opacity: 0.45; }
      .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      .status { color: var(--dim); font-size: 13px; margin: 4px 0; }
      .doom { height: 10px; background: #33363c; border-radius: 5px; overflow: hidden; margin: 4px 0; }
      .doom > div { height: 100%; background: linear-gradient(90deg, #8a3a2a, #ff5a3a); }
      #world { width: 100%; height: 240px; display: block; background: #1d232b; border-radius: 10px; }
      .board { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; }
      .card { background: var(--card); border-radius: 10px; padding: 8px 10px; border: 1px solid #3a3e46; }
      .card.threat { border: 2px solid #c0442e; background: #2c1f1d; }
      .card.opp { border: 1px solid #5a5040; }
      .card .kind { font: 700 10.5px system-ui; letter-spacing: 1px; color: #a59d8c; }
      .card.threat .kind { color: #ff7a5c; }
      .counters { display: flex; gap: 8px; margin: 6px 0; }
      .counters > div { flex: 1; background: #23262c; border-radius: 10px; padding: 6px 8px; text-align: center; }
      .counters b { display: block; font: 700 22px system-ui; }
      .counters span { font-size: 11px; color: #a59d8c; }
      .pawn { display: inline-block; background: #23262c; border-radius: 14px; padding: 4px 10px; margin: 2px 4px 2px 0; }
      .card.player { border-left: 4px solid var(--gold); }
      .card.agents { border-left: 4px solid var(--blue); }
      .card.no { opacity: 0.7; }
      .card .t { font-weight: 600; }
      .card .r { font-size: 12.5px; margin: 2px 0; }
      .card .k { color: var(--dim); }
      .card .ok { color: var(--green); }
      .card .bad { color: var(--red); }
      .card .w { color: #9fc8ff; }
      .card .x { color: #ffb19e; }
      .pill { display: inline-block; padding: 1px 6px; border-radius: 9px; background: #3a3e46; font-size: 11.5px; margin: 1px 2px 1px 0; }
      .relic { cursor: help; color: var(--violet); }
      .list { font-size: 12.5px; }
      .list div { margin: 2px 0; }
      pre { white-space: pre-wrap; font: 11.5px/1.35 ui-monospace, monospace; background: #111317; padding: 6px; border-radius: 7px; max-height: 40vh; overflow: auto; }
      textarea { width: 100%; box-sizing: border-box; height: 40vh; font: 12px ui-monospace, monospace; }
      details { background: #1e2126; border-radius: 9px; padding: 4px 8px; margin: 6px 0; }
      summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
      .slider { display: grid; grid-template-columns: 1fr 120px 52px; gap: 6px; align-items: center; font-size: 12px; margin: 3px 0; }
      table { border-collapse: collapse; font-size: 12px; width: 100%; }
      td, th { padding: 2px 4px; border-bottom: 1px solid #30343b; text-align: left; }
      .fatal { background: #5a1e1e; padding: 10px; border-radius: 8px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/cardlab/main.ts"></script>
  </body>
</html>
