<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Reclaimed — flora viewer</title>
    <style>
      html, body { margin: 0; height: 100%; background: #b8ccdb; font: 13px system-ui, sans-serif; color: #eef2ea; overflow: hidden; }
      /* (round 128, the editor: the tree framed above the panel on a phone, beside it on a desktop) */
      #view { position: fixed; left: 0; right: 0; top: 0; bottom: 45vh; width: 100%; height: 55vh; touch-action: none; }
      #panel { position: fixed; left: 0; right: 0; bottom: 0; height: 45vh; overflow-y: auto; box-sizing: border-box; background: rgba(24, 32, 24, 0.92); border-radius: 10px 10px 0 0; padding: 6px 10px; }
      @media (min-width: 760px) {
        #view { right: 380px; bottom: 0; width: calc(100% - 380px); height: 100%; }
        #panel { left: auto; top: 0; width: 380px; height: 100%; border-radius: 0; }
      }
      #panel .bar { display: flex; flex-wrap: wrap; gap: 4px; position: sticky; top: -6px; background: rgba(24, 32, 24, 0.97); padding: 4px 0; z-index: 1; }
      #panel .bar a { align-self: center; margin-left: auto; }
      #panel details.sec { border-top: 1px solid #3d4d39; padding: 2px 0; }
      #panel details.sec > summary { cursor: pointer; padding: 6px 0; font-weight: 600; }
      #panel .val { width: 38px; text-align: right; font-size: 11px; opacity: 0.75; flex: none; }
      #panel .val.edited { color: #f3d27a; opacity: 1; }
      #panel .hint { font-size: 11px; opacity: 0.75; margin: -2px 0 4px 98px; display: none; }
      #panel .hint.on { display: block; }
      #panel input[type='color'] { width: 40px; height: 22px; border: 0; padding: 0; background: none; }
      #panel .row { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
      #panel label { width: 92px; flex: none; opacity: 0.85; font-size: 12px; cursor: help; }
      #panel select, #panel input[type='number'] { flex: 1; min-width: 0; font: inherit; background: #2b3a2b; color: inherit; border: 1px solid #4b5d47; border-radius: 6px; padding: 3px; }
      #panel input[type='range'] { flex: 1; min-width: 0; }
      #panel button { font: inherit; background: #4d6b3c; color: inherit; border: 0; border-radius: 6px; padding: 4px 8px; }
      #stats { opacity: 0.8; font-size: 11px; margin: 2px 0 4px; }
      #panel a { color: #cfe8a9; }
      .fatal { position: fixed; inset: 20% 10%; background: #400; color: #fff; padding: 16px; white-space: pre-wrap; border-radius: 8px; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="panel">
      <div class="bar" id="params">
        <button id="newvar">new variant</button><button id="save">save…</button><button id="export">export</button><button id="import">import</button>
        <input id="importfile" type="file" accept=".json,application/json" style="display: none" />
        <a id="world" href="./">see it in the world →</a>
      </div>
      <div id="stats"></div>
      <details class="sec" open>
        <summary>Tree</summary>
        <div class="row"><label>show</label><select id="mode"><option value="scene">a scene</option><option value="plant">one plant</option></select></div>
        <div class="row" id="row-biome"><label>biome</label><select id="biome"></select></div>
        <div class="row" id="row-species"><label>species</label><select id="species"></select></div>
        <div class="row"><label>seed</label><input id="seed" type="number" min="0" step="1" /><button id="reseed">new</button><button id="grow">grow</button></div>
        <div class="row"><label>season</label><input id="season" type="range" min="0" max="1" step="0.01" /></div>
        <div class="row" id="seasons" style="flex-wrap: wrap; gap: 3px"></div>
        <div class="row"><label>state</label><select id="pstate"><option value="0">alive</option><option value="1">dead (leafless)</option><option value="2">burned</option></select></div>
        <div class="row" id="row-growth"><label>growth</label><input id="growth" type="range" min="0.05" max="1" step="0.01" /></div>
        <div class="row"><label>wind</label><input id="wind" type="range" min="0" max="1.5" step="0.01" /></div>
        <div class="row" id="row-density"><label>density</label><input id="density" type="range" min="0.2" max="2" step="0.05" /></div>
      </details>
      <div id="params-body"></div>
      <details class="sec">
        <summary>Compare &amp; save</summary>
        <div class="row"><label>every kind</label><input id="lineup" type="checkbox" /><span style="font-size: 11px; opacity: 0.75">each kind of shrub or grass in a row</span></div>
        <div class="row"><label>side by side</label><input id="compare" type="checkbox" /><button id="reset">reset to the species</button></div>
        <div class="row"><label>left tree</label><select id="against"><option value="old">the old generator</option><option value="species">the species as written</option></select></div>
        <div class="row"><label>saved trees</label><select id="saved"><option value="">—</option></select></div>
        <div class="row"><a id="atlas" href="./">see the plants in the atlas →</a></div>
      </details>
    </div>
    <script type="module" src="/src/flora/viewer.ts"></script>
  </body>
</html>
