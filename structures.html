<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Reclaimed structures</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1b1f24; overflow: hidden; font: 13px system-ui, sans-serif; color: #e8e4da; }
      #view { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
      #panel { position: fixed; top: 8px; left: 8px; width: 240px; max-width: calc(100vw - 32px); background: rgba(24, 26, 30, 0.82); border-radius: 10px; padding: 8px 10px; backdrop-filter: blur(6px); }
      #panel.folded > :not(.head) { display: none; }
      .head { display: flex; justify-content: space-between; align-items: center; font-weight: 600; margin-bottom: 4px; }
      .row { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
      .row > span { width: 56px; opacity: 0.75; }
      .row select, .row input[type='range'] { flex: 1; min-width: 0; }
      .row input[type='number'] { width: 70px; }
      button, select, input { font: inherit; background: #30343b; color: inherit; border: 1px solid #4a4f58; border-radius: 6px; padding: 3px 7px; }
      .views { display: flex; gap: 4px; margin: 6px 0 2px; }
      .views button { flex: 1; }
      .views button.on { background: #b4553a; border-color: #d0755a; }
      .stats { margin-top: 6px; opacity: 0.7; font-size: 11px; line-height: 1.35; }
      .fatal { position: fixed; inset: 20% 10% auto; background: #5a1e1e; padding: 14px; border-radius: 8px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="panel"></div>
    <script type="module" src="/src/structures/viewer/main.ts"></script>
  </body>
</html>
