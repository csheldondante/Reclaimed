# Build the game and publish it to GitHub Pages. One site holds every branch:
# main at the root, each other branch that is on origin under /<branch>/
# (docs/BRANCHES.md), so any branch can be tried on a phone. Round 128o: only the active branches are
# built (a full build of ~150 took ~15 min); every other branch keeps its history in git and comes back
# by adding it to the list below. A push to any of
# them rebuilds them all from origin, so the workflow must be the same on each.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    # (round 112) only places and main deploy: the github-pages environment allows only them, and a feature
    # branch's run used to cancel places' (cancel-in-progress) and then be rejected. Every run builds all the
    # branches listed below from origin, so a feature branch is published by the next push to places.
    branches: [main, places]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build every branch
        run: |
          set -e
          mkdir -p site
          for b in main places fortress gates onetown phonefix townlab; do
            git rev-parse -q --verify "origin/$b" >/dev/null || continue
            git worktree add -f "../wt-$b" "origin/$b"
            (cd "../wt-$b" && npm ci && npm run build)
            if [ "$b" = main ]; then cp -r "../wt-$b/dist/." site/; else mkdir -p "site/$b" && cp -r "../wt-$b/dist/." "site/$b/"; fi
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
