<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Reclaimed — building lab</title>
    <style>
      html, body { margin: 0; height: 100%; background: #ccd9e2; font: 13px system-ui, sans-serif; color: #f2eee6; overflow: hidden; }
      #view { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
      #panel { position: fixed; left: 8px; top: 8px; max-width: min(300px, calc(100% - 16px)); background: rgba(40, 34, 28, 0.72); border-radius: 10px; padding: 8px 10px; }
      #panel .row { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
      #panel label { width: 52px; opacity: 0.85; }
      #panel select { flex: 1; font: inherit; background: #3b3229; color: inherit; border: 1px solid #5e5044; border-radius: 6px; padding: 3px; }
      #panel input[type='range'] { flex: 1; min-width: 0; }
      #panel button { font: inherit; background: #7a5a3c; color: inherit; border: 0; border-radius: 6px; padding: 4px 8px; }
      #stats { opacity: 0.85; font-size: 11px; margin-top: 4px; }
      .fatal { position: fixed; inset: 20% 10%; background: #400; color: #fff; padding: 16px; white-space: pre-wrap; border-radius: 8px; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="panel">
      <div class="row"><label>style</label><select id="style"></select></div>
      <div class="row"><label>detail</label><input id="detail" type="range" min="0" max="1" step="0.05" /></div>
      <div class="row"><label>night</label><input id="night" type="range" min="0" max="1" step="0.05" /></div>
      <div class="row"><label>pitch</label><input id="pitch" type="range" min="20" max="89" step="1" /></div>
      <div class="row"><button id="bench">time generation</button></div>
      <div id="stats"></div>
    </div>
    <script type="module" src="/src/archgen/lab.ts"></script>
  </body>
</html>
