<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Nested scales lab</title>
    <style>
      html, body { margin: 0; height: 100%; background: #9fb6c8; font: 14px system-ui, sans-serif; color: #f2f4ee; overflow: hidden; }
      #view { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
      #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; justify-content: center; pointer-events: none; }
      #bar button { pointer-events: auto; min-width: 64px; min-height: 48px; font: inherit; font-weight: 600; background: rgba(28, 36, 30, 0.78); color: inherit; border: 2px solid transparent; border-radius: 10px; padding: 6px 10px; }
      #bar button.on { border-color: #e8d36a; background: rgba(70, 84, 46, 0.9); }
      #bar .slider { pointer-events: auto; display: flex; align-items: center; gap: 6px; min-height: 48px; background: rgba(28, 36, 30, 0.78); border-radius: 10px; padding: 0 10px; font-weight: 600; }
      #bar .slider input { width: 110px; height: 32px; accent-color: #e8d36a; }
      #bar .slider .val { min-width: 62px; font-weight: 400; font-size: 13px; }
      #hud { position: fixed; left: 8px; top: 8px; max-width: min(420px, calc(100% - 96px)); display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
      #info { background: rgba(24, 30, 26, 0.72); border-radius: 8px; padding: 6px 9px; white-space: pre-wrap; font-size: 12px; line-height: 1.35; }
      #cruise { display: none; background: rgba(20, 26, 40, 0.85); border-radius: 8px; padding: 6px 9px; white-space: pre-wrap; font: 600 15px/1.35 ui-monospace, monospace; }
      #aim { position: fixed; right: 8px; top: 34%; display: flex; flex-direction: column; gap: 14px; }
      #aim button { width: 68px; height: 68px; border-radius: 50%; font: 700 15px system-ui, sans-serif; background: rgba(28, 36, 30, 0.78); color: #f2f4ee; border: 2px solid transparent; touch-action: none; user-select: none; -webkit-user-select: none; }
      #aim button.on { border-color: #e8d36a; }
      #log { position: fixed; inset: 8px; overflow: auto; background: rgba(20, 24, 22, 0.92); border-radius: 8px; padding: 10px; white-space: pre-wrap; font: 12px ui-monospace, monospace; display: none; }
      .fatal { position: fixed; inset: 20% 8%; background: #4a1010; color: #fff; padding: 16px; white-space: pre-wrap; border-radius: 8px; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud"><div id="info"></div><div id="cruise"></div></div>
    <div id="aim"></div>
    <div id="bar"></div>
    <div id="log"></div>
    <script type="module" src="/src/nested/main.ts"></script>
  </body>
</html>
