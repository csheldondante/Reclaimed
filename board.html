<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14161a" />
    <title>Reclaimed board</title>
    <style>
      :root { --bg: #14161a; --panel: rgba(20, 22, 26, 0.94); --line: #3a3e46; --ink: #f2ede1; --dim: #b2a993; --act: #2ee6ff; --foe: #ff3b30; --good: #9be37a; --warn: #ffb08a; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font: 15px/1.35 system-ui, -apple-system, sans-serif; -webkit-user-select: none; user-select: none; touch-action: none; }
      canvas { position: fixed; inset: 0; width: 100vw; height: 100dvh; display: block; touch-action: none; }
      button { font: inherit; color: inherit; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
      #top { position: fixed; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top) + 6px) 8px 6px; background: var(--panel); border-bottom: 1px solid var(--line); z-index: 3; }
      #top .row { display: flex; gap: 6px; align-items: stretch; }
      .season { flex: 0 0 auto; display: flex; flex-direction: column; justify-content: center; padding: 0 6px 0 2px; }
      .season b { font: 700 17px Georgia, serif; }
      .season span { font-size: 11px; color: var(--dim); }
      .pool { flex: 1; text-align: center; background: #22252b; border-radius: 9px; padding: 3px 0 2px; transition: background 0.25s; }
      .pool b { display: block; font: 800 18px system-ui; }
      .pool span { display: block; font-size: 10.5px; color: var(--dim); }
      .pool.pulse { background: #3c4a2c; }
      .pool.bad b { color: var(--warn); }
      #needs { display: flex; gap: 6px; overflow-x: auto; margin-top: 6px; scrollbar-width: none; }
      #needs::-webkit-scrollbar { display: none; }
      .need { flex: 0 0 auto; min-height: 34px; padding: 4px 10px; border-radius: 17px; background: #2b2e35; border: 1.5px solid var(--act); font-size: 13px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
      .need.raid { border-color: var(--foe); }
      .need b { font-weight: 800; }
      #bottom { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 8px calc(env(safe-area-inset-bottom) + 8px); background: var(--panel); border-top: 1px solid var(--line); z-index: 3; display: flex; gap: 8px; }
      #bottom button { min-height: 52px; border-radius: 12px; background: #2b2e35; padding: 0 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; }
      #bottom button.piece { flex: 0 0 auto; min-width: 74px; border: 2px solid transparent; }
      #bottom button.piece small { font-weight: 600; color: var(--dim); font-size: 12px; }
      #bottom button.piece.armed { border-color: var(--act); background: #12333a; }
      #bottom button.piece:disabled { opacity: 0.4; }
      #bottom button.region { flex: 0 0 auto; min-width: 58px; }
      #bottom button.next { flex: 1; background: #6b4a12; border: 1.5px solid #a07a34; }
      #sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: #1b1d22; border-top: 2px solid var(--line); border-radius: 16px 16px 0 0; padding: 12px 14px calc(env(safe-area-inset-bottom) + 12px); max-height: 62dvh; overflow-y: auto; box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.5); touch-action: pan-y; }
      #sheet[hidden], #banner[hidden], #skip[hidden], #hint[hidden] { display: none; }
      #sheet h2 { font: 700 18px Georgia, serif; margin: 0 40px 4px 0; }
      #sheet .close { position: absolute; right: 8px; top: 6px; width: 44px; height: 44px; border-radius: 22px; background: #2b2e35; font-size: 20px; }
      #sheet .who { color: var(--dim); font-size: 13.5px; }
      #sheet .say { font-style: italic; margin: 4px 0 8px; }
      #sheet .line { margin: 6px 0; }
      #sheet .line b { color: #ffd98a; }
      #sheet .pv { background: #23262c; border-radius: 10px; padding: 8px 10px; margin: 8px 0; }
      #sheet .pv .arrow { color: var(--dim); }
      #sheet .pv .down { color: var(--warn); }
      #sheet .pv .up { color: var(--good); }
      #sheet .bad { color: var(--warn); }
      #sheet .good { color: var(--good); }
      #sheet .acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
      #sheet .acts button, #sheet .use { min-height: 48px; border-radius: 12px; background: #2b2e35; padding: 6px 14px; font-weight: 700; }
      #sheet .acts button.go { background: var(--act); color: #06232a; flex: 1; }
      #sheet .acts button.foe { background: var(--foe); color: #111; flex: 1; }
      #sheet button:disabled { opacity: 0.4; }
      #sheet .thing { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 8px; }
      #sheet .slot { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
      #sheet .slot span { flex: 1; }
      #sheet .slot button { min-height: 44px; min-width: 64px; border-radius: 10px; background: #12333a; border: 1.5px solid var(--act); font-weight: 700; }
      #sheet .use { display: flex; width: 100%; text-align: left; margin: 6px 0; flex-direction: column; border: 1.5px solid var(--act); background: #12333a; }
      #sheet .use small { font-weight: 500; color: var(--dim); }
      #sheet .use:disabled { border-color: var(--line); background: #23262c; }
      #sheet .row-offer { display: flex; align-items: center; gap: 8px; margin: 6px 0; min-height: 44px; }
      #sheet .row-offer button { min-height: 44px; border-radius: 10px; background: #12333a; border: 1.5px solid var(--act); padding: 0 12px; font-weight: 700; }
      #banner { position: fixed; left: 12px; right: 12px; top: 19%; z-index: 4; text-align: center; pointer-events: none; }
      #banner div { display: inline-block; background: rgba(16, 18, 20, 0.88); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 16px; font: 700 20px Georgia, serif; }
      #banner small { display: block; font: 500 14px system-ui; color: var(--dim); margin-top: 3px; }
      #skip { position: fixed; right: 10px; z-index: 6; min-height: 48px; min-width: 88px; border-radius: 24px; background: #2b2e35; border: 1.5px solid var(--line); font-weight: 700; }
      #spells { position: fixed; left: 8px; right: 8px; z-index: 6; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
      #spells button { min-height: 52px; border-radius: 14px; background: #12333a; border: 2px solid var(--act); padding: 0 14px; font-weight: 800; }
      #spells button:disabled { opacity: 0.4; }
      #spells .count { background: rgba(16, 18, 20, 0.88); border-radius: 14px; padding: 8px 12px; font-weight: 700; }
      #hint { position: fixed; left: 50%; transform: translateX(-50%); z-index: 4; background: rgba(16, 18, 20, 0.9); border: 1.5px solid var(--act); border-radius: 18px; padding: 6px 14px; font-size: 14px; white-space: nowrap; pointer-events: none; }
      #toast { position: fixed; left: 10px; right: 10px; z-index: 4; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
      #toast div { background: rgba(16, 18, 20, 0.9); border-radius: 12px; padding: 6px 12px; font-size: 14px; border-left: 4px solid #ffd23f; max-width: 360px; }
      #err { position: fixed; inset: 20px; z-index: 9; background: #300; color: #fff; padding: 12px; white-space: pre-wrap; font: 13px monospace; overflow: auto; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="top"></div>
    <div id="toast"></div>
    <div id="hint" hidden></div>
    <div id="banner" hidden></div>
    <div id="spells"></div>
    <button id="skip" hidden>Skip</button>
    <div id="bottom"></div>
    <div id="sheet" hidden></div>
    <script type="module" src="/src/board/main.ts"></script>
  </body>
</html>
