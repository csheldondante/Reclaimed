<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reclaimed card table</title>
    <style>
      :root { --bg: #17191d; --card: #23262c; --line: #3a3e46; --ink: #ece6d8; --dim: #a59d8c; --gold: #f2c14e; --blue: #5ab0f0; --red: #ff7a5c; --green: #8fd16a; --violet: #b48cf0; }
      html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
      body { padding: 0 10px 90px; max-width: 980px; margin: 0 auto; }
      h1 { font: 600 16px Georgia, serif; margin: 0; }
      h2 { font: 600 14px Georgia, serif; margin: 14px 0 6px; color: var(--gold); }
      button, select, input { font: inherit; background: #30343b; color: inherit; border: 1px solid #4a4f58; border-radius: 7px; padding: 6px 10px; }
      button { min-height: 40px; cursor: pointer; }
      button.main { background: #5a3f12; border-color: #8a6a2e; font-weight: 600; }
      button:disabled { opacity: 0.45; cursor: default; }
      input { width: 64px; }
      header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 0 6px; border-bottom: 1px solid var(--line); }
      .pools { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin: 6px 0 4px; }
      .pool { background: var(--card); border-radius: 8px; padding: 4px 2px; text-align: center; }
      .pool b { display: block; font: 700 18px system-ui; }
      .pool span { display: block; font-size: 10.5px; color: var(--dim); line-height: 1.2; }
      .pool .inc { color: var(--green); }
      .threat { color: var(--red); font-weight: 600; font-size: 13px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
      .card { background: var(--card); border-radius: 10px; padding: 8px 10px; border: 1px solid var(--line); }
      .card.threat-card { border: 2px solid #c0442e; background: #2c1f1d; }
      .card h3 { font: 600 15px Georgia, serif; margin: 0 0 2px; }
      .who { color: var(--dim); font-size: 12.5px; }
      .say { font-style: italic; margin: 4px 0; }
      .row { margin: 3px 0; }
      .row b { color: var(--gold); font-weight: 600; }
      .bad b { color: var(--red); }
      .need { color: var(--red); font-size: 13px; }
      .tags { display: flex; flex-wrap: wrap; gap: 4px; margin: 5px 0 2px; }
      .tag { font-size: 11px; padding: 1px 7px; border-radius: 9px; background: #2f3a46; color: var(--blue); }
      .tag.off { background: #3a2a28; color: var(--red); text-decoration: line-through; }
      .tag.state { background: #2e3b29; color: var(--green); }
      .tag.ruin { background: #3a2a28; color: var(--red); }
      .acts { display: flex; gap: 6px; margin-top: 6px; }
      .acts button { flex: 1; }
      .small { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; }
      .thing { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font-size: 13px; }
      .thing.ruined { opacity: 0.75; border-color: #6a3a30; }
      .thing.target { border: 2px solid var(--violet); cursor: pointer; }
      .thing b { font-weight: 600; }
      .place { color: var(--dim); font-size: 12px; margin: 8px 0 3px; text-transform: uppercase; letter-spacing: 0.6px; }
      .wheel { display: flex; flex-wrap: wrap; gap: 6px; }
      .wheel button.armed { border-color: var(--violet); background: #3a2f52; }
      .log { font-size: 13px; }
      .log div { padding: 2px 0; border-bottom: 1px solid #24272d; }
      .log .s { color: var(--dim); margin-right: 6px; }
      .log .k-rule { color: var(--green); }
      .log .k-fight, .log .k-run { color: var(--gold); }
      .dim { color: var(--dim); }
      .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      footer { position: fixed; left: 0; right: 0; bottom: 0; background: #101215; border-top: 1px solid var(--line); padding: 8px 10px; }
      footer .bar { max-width: 980px; margin: 0 auto; }
      footer button.main { flex: 1; }
      details { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; margin-top: 12px; }
      summary { cursor: pointer; color: var(--gold); font: 600 14px Georgia, serif; }
      .why { font-size: 12.5px; color: var(--dim); margin-top: 3px; }
      .why.ok { color: var(--green); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/table/main.ts"></script>
  </body>
</html>
